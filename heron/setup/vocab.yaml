# Справочник конфигуратора: типы schema.org и поля, которые у них спрашивают.
# Сферы деятельности и специализации — отдельный классификатор, classifier.yaml.
#
# Здесь — «кто вы»: человек или организация и вид организации. Что именно
# делает человек или организация, говорит классификатор: сфера → специализация,
# у специализации бывает свой точный тип schema.org (стоматология → Dentist).
# У вида организации все поля общего типа плюс свои.
#
# `group: address` — поля адреса: конфигуратор показывает их одним блоком в порядке
# страна, город, регион, индекс, улица, дом. Телефоны, почта
# и профили — не поля, а конструктор каналов связи (`about.contacts`).
#
# Каждое поле знает, куда его ответ ложится в site.yaml (`to`), и как оно
# называется в разметке (`prop`). Разметку движок строит сам из site.yaml
# блоком `schema.entity` с подстановками — значения не дублируются.
#
# Добавить тип — дописать его в `types` (родитель — `parent`). Добавить поле —
# в `fields` и в список `fields` типа. Код конфигуратора менять не нужно.
#
# Виды полей (`kind`), кроме простого текста:
# - `enum` — выбор из перечисления schema.org (`enum`); `multiple: true` — несколько
#   значений списком; `emit: url` — в разметку идёт полный адрес https://schema.org/<значение>.
#   Подписи значений — в `labels.<перечисление>`.
# - `subtype` — выбор подтипа schema.org: `of` — общий тип, `options` — допустимые подтипы.
#   Подписи — в `labels.<общий тип>`.
# - `bool` — да или нет; пустой ответ — ключа нет.
# - `hours` — часы работы: конфигуратор собирает их из дней и времени, форму schema.org
#   строит сама.
# `fallback` — ключ site.yaml, из которого берётся значение, если поле пустое
# (адрес места работы — как у сайта). `person_name: true` у типа — поле `name`
# подписано как имя человека (`label_person`), хотя тип — организация.
# `labels` — подписи значений перечислений и подтипов, ru и en.

fields:
  name:
    to: organization.name
    prop: name
    localized: true
    label: {en: "Name of the organization", ru: "Название организации"}
    label_person: {en: "Full name", ru: "Имя и фамилия"}
    hint: {en: "As people and search engines should call you.", ru: "Как вас называют люди и поисковики."}
  legal_name:
    to: organization.legal_name
    prop: legalName
    localized: true
    label: {en: "Legal name", ru: "Юридическое название"}
    hint: {en: "Only if it differs from the name.", ru: "Только если отличается от названия."}
  about:
    to: organization.about
    prop: description
    localized: true
    kind: textarea
    label: {en: "What you do", ru: "Чем занимаетесь"}
    hint: {en: "One or two sentences, plain words.", ru: "Одно-два предложения простыми словами."}
  logo:
    to: organization.logo
    prop: logo
    kind: media
    label: {en: "Logo", ru: "Логотип"}
    hint: {en: "A file in media/, for example media/logo.png.", ru: "Файл в media/, например media/logo.png."}
  image:
    to: organization.image
    prop: image
    kind: media
    label: {en: "Photo", ru: "Фото"}
    hint: {en: "A file in media/: the place, the team or you.", ru: "Файл в media/: место, команда или вы."}
  street:
    to: contact.street
    prop: address.streetAddress
    localized: true
    group: address
    label: {en: "Street", ru: "Улица"}
    hint: {en: "", ru: ""}
  house:
    to: contact.house
    prop: address.house
    group: address
    label: {en: "House number", ru: "Дом"}
    hint: {en: "With building or office, if any: 12/3, office 5.", ru: "С корпусом или офисом, если есть: 12/3, офис 5."}
  postal_code:
    to: contact.postal_code
    prop: address.postalCode
    group: address
    label: {en: "Postal code", ru: "Индекс"}
    hint: {en: "", ru: ""}
  city:
    to: contact.city
    prop: address.addressLocality
    group: address
    localized: true
    label: {en: "City", ru: "Город"}
    hint: {en: "", ru: ""}
  region:
    to: contact.region
    prop: address.addressRegion
    group: address
    localized: true
    label: {en: "Region", ru: "Регион"}
    hint: {en: "State, province or land, if it matters.", ru: "Область или земля, если это важно."}
  country:
    to: contact.country
    prop: address.addressCountry
    group: address
    kind: country
    label: {en: "Country", ru: "Страна"}
    hint: {en: "In site.yaml as a two-letter code: AT, DE, UA.", ru: "В site.yaml - кодом из двух букв: AT, DE, UA."}
  latitude:
    to: contact.geo.latitude
    prop: geo.latitude
    kind: number
    label: {en: "Latitude", ru: "Широта"}
    hint: {en: "From the map: right click on the place.", ru: "С карты: правый клик по месту."}
  longitude:
    to: contact.geo.longitude
    prop: geo.longitude
    kind: number
    label: {en: "Longitude", ru: "Долгота"}
    hint: {en: "", ru: ""}
  opening_hours:
    to: contact.hours
    prop: openingHours
    kind: hours
    label: {en: "Opening hours", ru: "Часы работы"}
    hint: {en: "Choose the days and the time; add a rule for each different schedule.", ru: "Выберите дни и время; для другого расписания добавьте ещё правило."}
  area_served:
    to: organization.area_served
    prop: areaServed
    localized: true
    label: {en: "Area served", ru: "Где работаете"}
    hint: {en: "A city, a region or a country.", ru: "Город, регион или страна."}
  founding_date:
    to: organization.founding_date
    prop: foundingDate
    kind: date
    label: {en: "Founded", ru: "Год основания"}
    hint: {en: "A year or a date: 2013 or 2013-05-01.", ru: "Год или дата: 2013 или 2013-05-01."}
  job_title:
    to: organization.job_title
    prop: jobTitle
    localized: true
    label: {en: "Job title", ru: "Должность или профессия"}
    hint: {en: "", ru: ""}
  knows_about:
    to: organization.knows_about
    prop: knowsAbout
    kind: lines
    localized: true
    label: {en: "Areas of expertise", ru: "В чём разбираетесь"}
    hint: {en: "One topic per line.", ru: "По теме на строку."}
  works_for:
    to: organization.works_for
    prop: worksFor.name
    localized: true
    label: {en: "Works for", ru: "Где работаете"}
    hint: {en: "The company, if any.", ru: "Компания, если есть."}
  price_range:
    to: organization.price_range
    prop: priceRange
    money: true
    label: {en: "Price range", ru: "Уровень цен"}
    hint: {en: "Goes into the markup only if prices are allowed in the Search group.", ru: "Попадает в разметку, только если цены разрешены в группе «Поиск»."}
  medical_specialty:
    to: organization.medical_specialty
    prop: medicalSpecialty
    kind: enum
    enum: MedicalSpecialty
    multiple: true
    emit: url
    label: {en: "Medical specialty", ru: "Медицинская специальность"}
    hint: {en: "Only schema.org values. If your narrow specialty is missing, choose a few closest ones and keep the word in the description.", ru: "Только значения schema.org. Узкой специальности нет - выберите несколько ближайших, а слово специальности оставьте в описании."}
  practices_at_type:
    to: organization.works_for_type
    prop: practicesAt.@type
    kind: subtype
    of: MedicalOrganization
    options: [Hospital, MedicalClinic, PhysiciansOffice, Physician, Dentist, DiagnosticLab]
    label: {en: "Type of workplace", ru: "Тип места работы"}
    hint: {en: "", ru: ""}
  practices_at:
    to: organization.works_for
    prop: practicesAt.name
    localized: true
    label: {en: "Workplace", ru: "Место работы"}
    hint: {en: "The clinic or hospital where you see patients.", ru: "Клиника или больница, где вы принимаете."}
  practices_at_street:
    to: organization.works_for_street
    prop: practicesAt.address.streetAddress
    localized: true
    label: {en: "Workplace address: street and number", ru: "Адрес места работы: улица и дом"}
    hint: {en: "Empty - same as the site.", ru: "Пусто - как у сайта."}
  practices_at_city:
    to: organization.works_for_city
    prop: practicesAt.address.addressLocality
    fallback: contact.city
    localized: true
    label: {en: "Workplace city", ru: "Город места работы"}
    hint: {en: "Empty - same as the site.", ru: "Пусто - как у сайта."}
  practices_at_region:
    to: organization.works_for_region
    prop: practicesAt.address.addressRegion
    fallback: contact.region
    localized: true
    label: {en: "Workplace region", ru: "Регион места работы"}
    hint: {en: "Empty - same as the site.", ru: "Пусто - как у сайта."}
  practices_at_postal_code:
    to: organization.works_for_postal_code
    prop: practicesAt.address.postalCode
    fallback: contact.postal_code
    label: {en: "Workplace postal code", ru: "Индекс места работы"}
    hint: {en: "Empty - same as the site.", ru: "Пусто - как у сайта."}
  practices_at_country:
    to: organization.works_for_country
    prop: practicesAt.address.addressCountry
    fallback: contact.country
    kind: country
    label: {en: "Workplace country", ru: "Страна места работы"}
    hint: {en: "Empty - same as the site.", ru: "Пусто - как у сайта."}
  hospital_affiliation:
    to: organization.hospital_affiliation
    prop: hospitalAffiliation.name
    localized: true
    label: {en: "Affiliated hospital", ru: "Больница, с которой связаны"}
    hint: {en: "Only if it differs from the workplace.", ru: "Только если это не место работы."}
  accepts_new_patients:
    to: organization.accepts_new_patients
    prop: isAcceptingNewPatients
    kind: bool
    label: {en: "Accepting new patients", ru: "Принимает новых пациентов"}
    hint: {en: "", ru: ""}

# Поля, общие для всех типов, идут первыми; у частного типа добавляются свои.
common: [name]

types:
  Organization:
    label: {en: "Organization", ru: "Организация"}
    fields: [legal_name, founding_date, logo, about, country, city, region, postal_code, street, house]
  Corporation:
    parent: Organization
    label: {en: "Company", ru: "Компания"}
  LocalBusiness:
    parent: Organization
    label: {en: "Local business", ru: "Местный бизнес"}
    fields: [image, latitude, longitude, opening_hours, area_served, price_range]
  IndividualPhysician:
    parent: LocalBusiness
    person_name: true
    label: {en: "Doctor practising at a clinic or hospital", ru: "Врач, принимает в клинике или больнице"}
    fields: [medical_specialty, practices_at_type, practices_at, practices_at_street, practices_at_city,
      practices_at_region, practices_at_postal_code, practices_at_country, hospital_affiliation,
      accepts_new_patients]
  NGO:
    parent: Organization
    label: {en: "Non-profit", ru: "Некоммерческая организация"}
  EducationalOrganization:
    parent: Organization
    label: {en: "Educational organization", ru: "Учебная организация"}
  Person:
    label: {en: "Person", ru: "Человек"}
    fields: [job_title, works_for, about, image, country, city]


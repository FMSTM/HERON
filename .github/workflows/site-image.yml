# Образ сайта из репозитория контента — без клона HERON и без своего Dockerfile.
#
# Репозиторий сайта зовёт этот workflow одной строкой:
#
#   jobs:
#     image:
#       uses: FMSTM/HERON/.github/workflows/site-image.yml@prod
#       permissions: { contents: read, packages: write }
#       with:
#         env: dev                 # dev или prod: индексация, счётчики, домен из site.domains
#         engine: prod             # тег образа движка: prod, beta или X.Y.Z
#         export_docs: false       # true — только сайт движка: сырые файлы документации
#
# Что делает: собирает сайт движком из образа, упаковывает dist/ в образ
# nginx по Dockerfile.site этой же версии HERON, поднимает его и проверяет
# коды ответа (scripts/smoke-site.sh), затем пушит в реестр.
#
# export_docs: true — перед сборкой тем же образом движка выкладывает в static/
# сайта сырые файлы документации этой версии: agents/{ru,en}/** (`docs --export
# --all-langs`), schema/<major.minor>/*.json - описания по-английски - и
# schema/<major.minor>/ru/*.json - те же схемы по-русски (`schema --export --lang`),
# и AGENTS.md (`docs agents`). Произвольной команды вход не принимает — белый список (О10).
#
# Документация: docs/ru/guide/06-deploy.md, «Образ из репозитория сайта»;
# шаг export_docs - docs/ru/spec/22-deploy.md, раздел 4.

name: site-image

on:
  workflow_call:
    inputs:
      env:
        description: Окружение сборки сайта — dev или prod.
        type: string
        default: dev
      engine:
        description: >-
          Тег образа движка ghcr.io/fmstm/heron — prod, beta или X.Y.Z; закрепить
          точно — с digest: prod@sha256:<digest>.
        type: string
        default: prod
      path:
        description: Папка сайта внутри репозитория.
        type: string
        default: "."
      image:
        description: Имя образа сайта. Пусто — ghcr.io/<владелец>/<репозиторий>.
        type: string
        default: ""
      tag:
        description: Тег образа сайта. Пусто — имя окружения.
        type: string
        default: ""
      strict:
        description: Предупреждения — ошибки. По умолчанию — да для prod.
        type: string
        default: auto
      nginx_image:
        description: >-
          Стоковый nginx, на котором до сборки образа проверяется конфиг
          (`nginx -t`): битый конфиг не должен уехать в реестр.
        type: string
        # тот же nginx 1.30.6, что в Dockerfile.site, — прибит по digest
        default: nginx:1.30.6-alpine@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
      export_docs:
        description: >-
          Перед сборкой выложить в static/ сырые файлы документации движка:
          agents/{ru,en}/**, schema/<major.minor>/*.json (en) и schema/<major.minor>/ru/*.json,
          AGENTS.md (22 §4, 23 §12).
          Нужно сайту движка; обычному сайту — нет.
        type: boolean
        default: false
      push:
        description: Отправлять ли образ в реестр.
        type: boolean
        default: true
    outputs:
      image:
        description: Полное имя отправленного образа с тегом.
        value: ${{ jobs.image.outputs.image }}

jobs:
  image:
    name: образ сайта
    runs-on: ubuntu-26.04
    outputs:
      image: ${{ steps.names.outputs.image }}
    steps:
      - name: контент сайта
        uses: actions/checkout@v7
        with:
          # вся история: дата обновления страниц берётся из git
          fetch-depth: 0

      - name: имена
        id: names
        # Входные значения приходят переменными окружения и проверяются здесь:
        # подстановка ${{ inputs.* }} прямо в текст скрипта делала бы любое
        # значение кодом оболочки. Дальше шаги берут только проверенное.
        env:
          IN_IMAGE: ${{ inputs.image }}
          IN_TAG: ${{ inputs.tag }}
          IN_ENV: ${{ inputs.env }}
          IN_STRICT: ${{ inputs.strict }}
          IN_ENGINE: ${{ inputs.engine }}
          IN_PATH: ${{ inputs.path }}
          IN_NGINX: ${{ inputs.nginx_image }}
        run: |
          bad() { echo "::error::$1"; exit 1; }
          [[ "$IN_ENV" =~ ^[a-z][a-z0-9-]*$ ]] || bad "env: латиница, цифры, дефис"
          [[ "$IN_ENGINE" =~ ^(prod|beta|dev|[0-9]+\.[0-9]+\.[0-9]+)(@sha256:[0-9a-f]{64})?$ ]] \
            || bad "engine: prod, beta, dev или X.Y.Z, можно @sha256:<digest>"
          [[ "$IN_PATH" =~ ^[A-Za-z0-9._/-]+$ && ! "$IN_PATH" =~ (^|/)\.\.(/|$) && "$IN_PATH" != /* ]] \
            || bad "path: папка внутри репозитория без .."
          [[ "$IN_STRICT" =~ ^(auto|true|false)$ ]] || bad "strict: auto, true или false"
          [[ -z "$IN_IMAGE" || "$IN_IMAGE" =~ ^[a-z0-9][a-z0-9._/:-]*$ ]] || bad "image: имя образа"
          [[ -z "$IN_TAG" || "$IN_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]*$ ]] || bad "tag: тег образа"
          [[ "$IN_NGINX" =~ ^[a-z0-9][a-z0-9._/:@-]*$ ]] || bad "nginx_image: имя образа"
          image="$IN_IMAGE"
          [ -n "$image" ] || image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="$IN_TAG"
          [ -n "$tag" ] || tag="$IN_ENV"
          strict="$IN_STRICT"
          if [ "$strict" = auto ]; then
            [ "$IN_ENV" = prod ] && strict=true || strict=false
          fi
          # Dockerfile.site и smoke той же ветки HERON, что и движок:
          # prod → prod, beta → beta, dev → dev, 0.1.0 → тег v0.1.0
          # Движок можно закрепить по digest: `prod@sha256:…` — рецепт тогда
          # берётся с той же ветки, а образ движка — ровно этот.
          channel="${IN_ENGINE%%@*}"
          case "$channel" in
            prod|beta|dev) ref="$channel" ;;
            *) ref="v$channel" ;;
          esac
          {
            echo "heron_ref=$ref"
            # время сборки — время последнего коммита контента: воспроизводимо
            echo "epoch=$(git log -1 --format=%ct)"
            echo "image=$image:$tag"
            echo "strict=$strict"
            echo "env=$IN_ENV"
            echo "engine=$IN_ENGINE"
            echo "path=$IN_PATH"
            echo "nginx=$IN_NGINX"
          } >> "$GITHUB_OUTPUT"

      - name: рецепт образа этой версии HERON
        uses: actions/checkout@v7
        with:
          repository: FMSTM/HERON
          ref: ${{ steps.names.outputs.heron_ref }}
          path: .heron
          sparse-checkout: |
            Dockerfile.site
            scripts/smoke-site.sh
            scripts/smoke_site.py
          sparse-checkout-cone-mode: false

      - name: сырые файлы документации
        if: inputs.export_docs
        # Тот же образ движка и те же ограничения, что у сборки: без сети, корень
        # только на чтение, без capabilities, чужой uid. На запись монтируется
        # только static/ папки сайта, а не вся рабочая копия: при path "." это был бы
        # корень checkout вместе с .git и .heron/ (рецепт и smoke). Файлы дальше
        # попадают в dist/ обычной сборкой. Набор команд фиксирован.
        env:
          SITE_PATH: ${{ steps.names.outputs.path }}
          ENGINE: ${{ steps.names.outputs.engine }}
        run: |
          site="$PWD/$SITE_PATH"
          static="$site/static"
          [ -d "$site" ] || { echo "::error::path: нет папки $SITE_PATH"; exit 1; }
          # ссылка вместо static/ или static/AGENTS.md увела бы запись за пределы
          # папки сайта: монтирование и перенаправление оболочки идут по ссылкам
          [ ! -L "$static" ] || { echo "::error::static/ — символическая ссылка"; exit 1; }
          mkdir -p "$static"
          [ ! -L "$static/AGENTS.md" ] \
            || { echo "::error::static/AGENTS.md — символическая ссылка"; exit 1; }
          engine() {
            docker run --rm --network=none --read-only --tmpfs /tmp \
              --cap-drop=ALL --security-opt=no-new-privileges \
              --user "$(id -u):$(id -g)" \
              -v "$static":/out -w /out \
              "ghcr.io/fmstm/heron:$ENGINE" "$@"
          }
          # «heron, version 0.1.0 (beta, …)» → 0.1: схемы лежат по major.minor
          version="$(engine --version | sed -nE '1s/^heron, version ([0-9]+\.[0-9]+)\.[0-9].*$/\1/p')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::не удалось прочитать версию движка"; exit 1; }
          engine docs --export /out/agents --all-langs
          # схемы: английские описания основные, русские рядом в ru/ ($id у них общий)
          # образ старого движка может не знать --lang: тогда одна схема без ru/
          if engine schema --help | grep -q -- '--lang'; then
            engine schema --export "/out/schema/$version" --lang en
            engine schema --export "/out/schema/$version/ru" --lang ru
          else
            echo "::warning::образ движка без schema --lang: схемы без русской версии"
            engine schema --export "/out/schema/$version"
          fi
          # тема agents — AGENTS.md репозитория движка этой версии, байт в байт
          engine docs agents > "$static/AGENTS.md"
          need=(agents/ru/README.md agents/en/README.md "schema/$version/site.schema.json" AGENTS.md)
          [ -d "$static/schema/$version/ru" ] && need+=("schema/$version/ru/site.schema.json")
          for f in "${need[@]}"; do
            [ -s "$site/static/$f" ] || { echo "::error::нет static/$f"; exit 1; }
          done

      - name: сборка сайта
        # Те же ограничения, что у scripts/site.sh: без сети, корень только на
        # чтение, без capabilities, чужой uid. Контент — только на чтение;
        # писать можно в /out (сборка и кэш нарезок) и /tmp.
        env:
          SITE_ENV_NAME: ${{ steps.names.outputs.env }}
          STRICT: ${{ steps.names.outputs.strict }}
          EPOCH: ${{ steps.names.outputs.epoch }}
          SITE_PATH: ${{ steps.names.outputs.path }}
          ENGINE: ${{ steps.names.outputs.engine }}
        run: |
          out="$RUNNER_TEMP/heron-out"
          mkdir -p "$out"
          echo "HERON_OUT=$out" >> "$GITHUB_ENV"
          flags=(--env "$SITE_ENV_NAME" --out /out/dist)
          [ "$STRICT" = true ] && flags+=(--strict)
          engine() {
            docker run --rm --network=none --read-only --tmpfs /tmp \
              --cap-drop=ALL --security-opt=no-new-privileges \
              --user "$(id -u):$(id -g)" \
              -e SOURCE_DATE_EPOCH="$EPOCH" \
              -v "$PWD":/site:ro -v "$out":/out \
              -w "/site/$SITE_PATH" \
              "ghcr.io/fmstm/heron:$ENGINE" "$@"
          }
          engine --version
          engine build . "${flags[@]}"

      - name: конфиг nginx на стоковом nginx
        # Образ сайта проверяет конфиг на nginx-unprivileged при сборке; здесь —
        # на обычном nginx, как его подключит хост. Файл кладётся туда же, куда
        # и в образе: conf.d внутри http.
        env:
          NGINX_IMAGE: ${{ steps.names.outputs.nginx }}
        run: |
          docker run --rm \
            -v "$HERON_OUT/dist/.heron-nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            "$NGINX_IMAGE" nginx -t

      - uses: docker/setup-buildx-action@v4

      - name: образ
        # Кеш слоёв в GitHub Actions, отдельный scope от образа движка: слой
        # nginx и его конфиг не пересобираются, пока dist/ не изменился.
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.HERON_OUT }}/dist
          file: .heron/Dockerfile.site
          load: true
          push: false
          tags: ${{ steps.names.outputs.image }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=heron-site
          cache-to: type=gha,mode=max,scope=heron-site

      - name: дымовая проверка
        # Проверяется ровно тот образ, который уйдёт в реестр.
        env:
          IMAGE: ${{ steps.names.outputs.image }}
        run: |
          docker run -d --name heron-smoke -p 127.0.0.1:18080:8080 "$IMAGE"
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:18080/ && break
            sleep 0.5
          done
          bash .heron/scripts/smoke-site.sh http://localhost:18080 "$HERON_OUT/dist" \
            || { docker logs heron-smoke; exit 1; }
          docker rm -f heron-smoke

      - name: вход в реестр
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: отправка
        if: inputs.push
        env:
          IMAGE: ${{ steps.names.outputs.image }}
        run: docker push "$IMAGE"

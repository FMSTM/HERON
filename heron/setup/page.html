<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HERON setup</title>
<style>
:root {
  --ink: #17161c; --muted: #646673; --paper: #fbfaf7; --card: #ffffff; --line: #e4e2dc;
  --accent: #1d5fd1; --accent-soft: #e8effc; --ok: #1a7f4b; --bad: #b42318; --gold: #a87b12;
  --radius: 12px; --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; font: 16px/1.55 var(--font); color: var(--ink); background: var(--paper); }
a { color: var(--accent); }
code { font: .88em var(--mono); background: #f0eee8; padding: .1em .35em; border-radius: 4px; }
header.top { position: sticky; top: 0; z-index: 5; background: rgba(251,250,247,.94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
header.top .in { max-width: 62rem; margin: 0 auto; padding: .8rem 1rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.brand { font-weight: 800; letter-spacing: .04em; }
.brand small { font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: .4rem; }
.spacer { flex: 1; }
.langswitch button { border: 1px solid var(--line); background: var(--card); padding: .25rem .6rem; border-radius: 999px; cursor: pointer; font: inherit; font-size: .85rem; }
.langswitch button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.save { background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: .6rem 1.3rem; font: inherit; font-weight: 600; cursor: pointer; }
.save:disabled { opacity: .5; cursor: progress; }
main { max-width: 62rem; margin: 0 auto; padding: 1.5rem 1rem 6rem; }
.lead { color: var(--muted); max-width: 44rem; }
nav.groups { display: flex; flex-wrap: wrap; gap: .4rem; margin: 1.25rem 0 1.5rem; }
nav.groups a { text-decoration: none; color: var(--ink); border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: .3rem .8rem; font-size: .9rem; }
nav.groups a .n { color: var(--muted); margin-right: .3rem; }
section.group { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.4rem 1.5rem; margin-bottom: 1.25rem; scroll-margin-top: 5rem; }
section.group > h2 { margin: 0 0 .25rem; font-size: 1.3rem; }
section.group > h2 .n { color: var(--muted); font-weight: 500; margin-right: .5rem; }
section.group > p.about { margin: 0 0 1.1rem; color: var(--muted); }
.need { font-size: .75rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); margin-left: .5rem; vertical-align: middle; }
.grid { display: grid; gap: 1rem 1.25rem; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); }
.field { display: flex; flex-direction: column; gap: .3rem; }
.field.wide { grid-column: 1 / -1; }
.field label, .legend { font-weight: 600; font-size: .95rem; }
.hint { color: var(--muted); font-size: .85rem; }
.hint code { font-size: .82rem; }
input[type=text], input[type=url], input[type=email], input[type=tel], input[type=number], input[type=password], input[type=date], select, textarea {
  font: inherit; padding: .55rem .7rem; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); width: 100%;
}
textarea { min-height: 5.5rem; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.per-lang { display: grid; gap: .4rem; }
.per-lang .row { display: grid; grid-template-columns: 2.6rem 1fr; gap: .5rem; align-items: start; }
.per-lang .code { font: .8rem var(--mono); text-transform: uppercase; color: var(--muted); padding-top: .65rem; }
.choices { display: flex; flex-wrap: wrap; gap: .5rem; }
.choice { position: relative; }
.choice input { position: absolute; opacity: 0; }
.choice span { display: block; border: 1px solid var(--line); border-radius: 10px; padding: .55rem .85rem; cursor: pointer; background: #fff; }
.choice span b { display: block; }
.choice span small { color: var(--muted); }
.choice input:checked + span { border-color: var(--accent); background: var(--accent-soft); }
.choice input:focus-visible + span { outline: 2px solid var(--accent); }
.cascade { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.cascade select { width: auto; min-width: 12rem; }
.cascade .arrow { color: var(--muted); }
.tag-ok { color: var(--ok); font-size: .8rem; font-weight: 600; }
.tag-no { color: var(--muted); font-size: .8rem; }
.gold { color: var(--gold); font-weight: 700; }
.box { border: 1px dashed var(--line); border-radius: 10px; padding: .9rem 1rem; background: #fcfbf8; }
.box pre { margin: .5rem 0 0; white-space: pre-wrap; word-break: break-all; font: .85rem var(--mono); background: #17161c; color: #f1f0ec; padding: .7rem .8rem; border-radius: 8px; }
.writes { width: 100%; border-collapse: collapse; font-size: .9rem; margin-top: .5rem; }
.writes td { padding: .35rem .5rem; border-top: 1px solid var(--line); vertical-align: top; }
.writes td:first-child { font-family: var(--mono); white-space: nowrap; }
.toast { position: fixed; left: 50%; bottom: 1.25rem; transform: translateX(-50%); max-width: min(46rem, calc(100% - 2rem)); background: var(--ink); color: #fff; padding: .9rem 1.1rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.18); display: none; z-index: 9; }
.toast.bad { background: var(--bad); }
.toast ul { margin: .4rem 0 0; padding-left: 1.1rem; }
.toast button { float: right; background: none; border: 0; color: inherit; font-size: 1.1rem; cursor: pointer; }
.check { display: flex; gap: .5rem; align-items: center; }
.muted { color: var(--muted); }
.was[hidden] { display: none; }
.was { font-size: .82rem; color: var(--gold); display: flex; gap: .5rem; align-items: baseline; flex-wrap: wrap; }
.was::before { content: "●"; font-size: .6rem; }
.was button { border: 0; background: none; color: var(--accent); cursor: pointer; font: inherit; padding: 0; text-decoration: underline; }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .4rem; }
.chip { display: inline-flex; align-items: center; gap: .35rem; background: var(--accent-soft); border: 1px solid #c9d8f6; border-radius: 999px; padding: .2rem .35rem .2rem .7rem; font-size: .9rem; }
.chip.main { background: var(--ink); color: #fff; border-color: var(--ink); }
.chip button { border: 0; background: rgba(0,0,0,.08); border-radius: 50%; width: 1.3rem; height: 1.3rem; cursor: pointer; line-height: 1; color: inherit; }
.tabs-row { display: flex; gap: .25rem; flex-wrap: wrap; }
.tabs-row button { border: 1px solid var(--line); border-bottom: 0; background: #f3f2ee; border-radius: 8px 8px 0 0; padding: .35rem .8rem; cursor: pointer; font: inherit; font-size: .88rem; }
.tabs-row button[aria-selected="true"] { background: #fff; font-weight: 600; }
.tab-body textarea { border-top-left-radius: 0; }
.contact-row { display: grid; grid-template-columns: 11rem 11rem 1fr 2.2rem; gap: .5rem; align-items: center; margin-bottom: .5rem; }
.contact-row button.x { border: 1px solid var(--line); background: #fff; border-radius: 8px; height: 2.4rem; cursor: pointer; }
.add { border: 1px dashed var(--accent); background: #fff; color: var(--accent); border-radius: 8px; padding: .45rem .9rem; cursor: pointer; font: inherit; }
.subbox { border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.1rem; background: #fcfbf8; }
.subbox > h3 { margin: 0 0 .75rem; font-size: 1rem; }
table.envs { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.envs th, table.envs td { text-align: left; padding: .45rem .5rem; border-top: 1px solid var(--line); vertical-align: top; }
table.envs tr.on td { background: var(--accent-soft); }
table.envs code { word-break: break-all; }
.preview { font-size: .9rem; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: .5rem .7rem; margin-top: .3rem; }
.dev { display: inline-block; font-size: .75rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--gold); border: 1px solid var(--gold); border-radius: 999px; padding: .05rem .5rem; margin-left: .5rem; vertical-align: middle; }
@media (max-width: 40rem) { section.group { padding: 1.1rem 1rem; } .contact-row { grid-template-columns: 1fr 1fr; } .contact-row input { grid-column: 1 / -1; } }
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand">HERON <small data-t="title">setup</small></div>
  <div class="spacer"></div>
  <div class="langswitch" role="group" aria-label="Language">
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="ru">RU</button>
  </div>
  <button class="save" id="save" type="button" data-t="save">Save</button>
</div></header>

<main>
  <h1 data-t="h1">Set up your site</h1>
  <p class="lead" data-t="lead">Fill in what you know. Only the first two groups are needed to start; the rest can wait until you publish. Every answer lands in site.yaml, and you can come back and change it later.</p>
  <nav class="groups" id="groups"></nav>
  <form id="form" autocomplete="off" onsubmit="return false"></form>
  <p class="muted" id="engine"></p>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

}
function imageOf(env) {

}
function gPublish() {
  const p = A.publish;
  if (p.way === "git") p.way = "github";
  const body = [choices("publish.way", [
    ["github", t("way_github"), t("way_github_s")], ["dockerhub", t("way_hub"), t("way_hub_s")],
    ["static", t("way_static"), t("way_static_s")], ["none", t("way_none"), t("way_none_s")],

  if (p.way === "github") {
    grid.append(field(t("repo"), "publish.repo", t("repo_h"), "text", { placeholder: ST.git_remote || "you/my-site" }), field(t("branch"), "publish.branch", t("branch_h")));
    const auto = h("input", { type: "checkbox", id: "publish.auto" }); auto.checked = p.auto !== false;
    auto.addEventListener("change", () => { p.auto = auto.checked; render(); });

  }
  if (p.way === "dockerhub") grid.append(field(t("hub_user"), "publish.dockerhub_user", ""), field(t("hub_image"), "publish.image", t("hub_image_h")));
  if (p.way === "static") {
    grid.append(h("div", { class: "field wide" }, h("span", { class: "legend" }, t("target")), choices("publish.static_target", [["server", t("target_server")], ["pages", t("target_pages")]], render)));
    if (p.static_target === "server") grid.append(field(t("server"), "publish.server", t("server_h"), "text", { placeholder: "deploy@example.com" }), field(t("path"), "publish.path", t("path_h"), "text", { placeholder: "/var/www/" + (A.site.domain || "example.com") }));
    else grid.append(field(t("branch"), "publish.branch", t("branch_h")));
  }
  if (p.way !== "none") {
    const env = h("select", { id: "publish.env" }, ...["dev", "prod"].map((x) => h("option", { value: x, selected: p.env === x }, x)));
    env.addEventListener("change", () => { p.env = env.value; render(); });
    grid.append(h("div", { class: "field" }, h("label", { for: "publish.env" }, t("env")), env, hint(t("env_h")), track("publish.env")));
    grid.append(field(t("engine"), "publish.engine", t("engine_h")));
    const image = p.way === "github" ? p.auto !== false : p.way === "dockerhub";
    const rows = ["dev", "prod"].map((e) => h("tr", { class: e === p.env ? "on" : null },
      h("td", {}, e, e === p.env ? " · " + t("env_now") : ""),
      h("td", {}, h("code", {}, e === "dev" ? (A.site.preview_domain || "—") : (A.site.domain || "—"))),
      h("td", {}, e === "dev" ? t("index_closed") : t("index_open")),
      image ? h("td", {}, h("code", {}, imageOf(e))) : null));
    grid.append(h("div", { class: "field wide" }, h("span", { class: "legend" }, t("envs_t")),
      h("table", { class: "envs" }, h("tr", {}, h("th", {}, t("env_col")), h("th", {}, t("env_domain")), h("th", {}, t("env_index")), image ? h("th", {}, t("env_image")) : null), ...rows)));
  }
  body.push(grid);
  const files = [["site.yaml", t("w_site")], ["scripts/build.sh", t("w_build")]];
  if (p.way === "github") { if (p.auto !== false) files.push([".github/workflows/image.yml", t("w_image")]); files.push(["scripts/publish.sh", t("w_publish")], [".gitignore", t("w_ignore")]); }
  if (p.way === "dockerhub") files.push(["scripts/publish.sh", t("w_publish")]);
  if (p.way === "static") files.push(p.static_target === "pages" ? [".github/workflows/pages.yml", t("w_pages")] : ["scripts/publish.sh", t("w_publish")]);
  body.push(h("div", { class: "field wide", style: "margin-top:1rem" }, h("span", { class: "legend" }, t("writes_t")),
    h("table", { class: "writes" }, ...files.map(([f, d]) => h("tr", {}, h("td", {}, f), h("td", {}, d))))));
  return group("pub", "6", t("g_pub"), t("g_pub_about"), null, ...body);
}
function gKeys() { return group("keys", "7", t("g_keys"), t("g_keys_about"), "dev"); }
function gTheme() {
  const th = A.theme;

  const current = ST.site_theme || "main";
  const white = ["main", "starter"].includes(current);
  const body = [choices("theme.source", [
    ["keep", t("th_keep") + ": " + current, white ? t("th_white") : ""],
    ["name", t("th_name"), ""], ["url", t("th_url"), ""], ["file", t("th_file"), ""],
  ], render)];
  const grid = h("div", { class: "grid", style: "margin-top:1rem" });

    const sel = h("select", { id: "theme.value" }, ...list.map((x) => h("option", { value: x.name, selected: th.value === x.name }, (x.title || x.name) + (x.description ? " — " + x.description : ""))));
    if (!th.value && list.length) th.value = list[0].name;

    grid.append(h("div", { class: "field wide" }, sel));
  }
  if (th.source === "url") grid.append(field(t("th_url"), "theme.value", t("th_url_h"), "url", { placeholder: "https://…/theme.tar.gz" }, true));
  if (th.source === "file") {
    const file = h("input", { type: "file", accept: ".zip,.tar.gz,.tgz,application/zip,application/gzip" });
    file.addEventListener("change", async () => {
      const f = file.files[0]; if (!f) return;
      const r = await fetch("/api/upload", { method: "POST", headers: { "X-Heron-Token": TOKEN }, body: f });
      const j = await r.json(); UPLOAD = j.upload || ""; th.value = f.name;

function render() {
  document.documentElement.lang = L;
  for (const el of document.querySelectorAll("[data-t]")) el.textContent = t(el.dataset.t);
  for (const b of document.querySelectorAll(".langswitch button")) b.setAttribute("aria-pressed", String(b.dataset.lang === L));
  const y = window.scrollY;
  TRACKS.length = 0;
  const form = $("#form"); form.replaceChildren(gSite(), gLang(), gWho(), gSearch(), gAnalytics(), gPublish(), gKeys(), gTheme());
  $("#groups").replaceChildren(...[...form.querySelectorAll("section.group")].map((s) => h("a", { href: "#" + s.id }, h("span", { class: "n" }, $(".n", s).textContent), $(".title", s).textContent)));
  refresh();
  window.scrollTo(0, y);
  $("#engine").textContent = "HERON " + ST.engine;
}
function toast(kind, title, lines) {
  const el = $("#toast"); el.className = "toast" + (kind === "bad" ? " bad" : "");
  el.replaceChildren(h("button", { type: "button", "aria-label": "close", onclick: () => (el.style.display = "none") }, "×"), h("b", {}, title), lines && lines.length ? h("ul", {}, ...lines.map((x) => h("li", {}, x))) : null);
  el.style.display = "block";
}
function load(state) { ST = state; A = clone(state.answers); BASE = clone(state.answers); UPLOAD = ""; }
async function save() {
  const btn = $("#save"); btn.disabled = true; btn.textContent = t("saving");
  try {
    const answers = clone(A);
    answers.about.contacts = (answers.about.contacts || []).filter((c) => (c.value || "").trim());
    const r = await fetch("/api/save", { method: "POST", headers: { "Content-Type": "application/json", "X-Heron-Token": TOKEN }, body: JSON.stringify({ answers, upload: UPLOAD }) });
    const j = await r.json();
    if (!j.ok) { toast("bad", t("error"), [j.error, j.hint].filter(Boolean)); return; }
    const lines = [];
    if (j.written.length) lines.push(t("written") + ": " + j.written.join(", "));
    if (j.created.length) lines.push(t("created") + ": " + j.created.slice(0, 8).join(", ") + (j.created.length > 8 ? " …" : ""));
    if (j.removed.length) lines.push(t("removed") + ": " + j.removed.join(", "));
    if (j.kept.length) lines.push(t("kept") + ": " + j.kept.join(", "));
    if (j.backup) lines.push(t("backup") + ": " + j.backup);
    if (!lines.length) lines.push(t("nothing"));
    lines.push(t("next"));
    load(j.state);
    render();
    toast("ok", t("saved"), lines);
  } catch (e) { toast("bad", t("error"), [String(e)]); }
  finally { btn.disabled = false; btn.textContent = t("save"); }
}
document.querySelectorAll(".langswitch button").forEach((b) => b.addEventListener("click", () => { L = b.dataset.lang; render(); }));
$("#save").addEventListener("click", save);
document.addEventListener("keydown", (e) => { if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); save(); } });
fetch("/api/state").then((r) => r.json()).then((s) => { load(s); L = s.notes === "en" ? "en" : "ru"; render(); });

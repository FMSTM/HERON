name: ci

on:
  push:
    branches: [dev, beta, prod]
    tags: ["v*"]
  pull_request:
    branches: [dev, beta, prod]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/heron

jobs:

  # Раннер закреплён явно, не ubuntu-latest: смена ОС сборщика — наше
  # решение отдельной правкой, а не сюрприз от GitHub.
  quality:
    name: линт и тесты
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Полная история всех веток: check_commit_messages.sh сверяет
          # коммиты после origin/prod. С fetch-depth: 0 checkout забирает
          # refs/heads/* в refs/remotes/origin/*, отдельный fetch prod не нужен;
          # ветки prod ещё нет (первый пуш) — скрипт пропускает проверку с пометкой.
          fetch-depth: 0

      - name: поставить uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: python 3.12
        run: uv python install 3.12

      - name: зависимости
        run: uv sync --group dev

      - name: кеш .deb nginx
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: ~/.apt-archives
          key: apt-nginx-${{ runner.os }}-${{ runner.arch }}-ubuntu-26.04

      - name: nginx для проверок конфига
        # 301, 410, 404 и скрытые файлы проверяются настоящим nginx: nginx -t
        # и HTTP-ответы. Без него эти тесты пропускаются — здесь это запрещено.
        # .deb лежат в кеше (~/.apt-archives); при попадании apt-get update
        # не нужен, пакеты ставятся из кеша.
        run: |
          mkdir -p "$HOME/.apt-archives/partial"
          if [ "${{ steps.apt-cache.outputs.cache-hit }}" != "true" ]; then
            sudo apt-get update -q
          fi
          sudo apt-get install -y -q -o "Dir::Cache::archives=$HOME/.apt-archives" nginx
          sudo chown -R "$USER" "$HOME/.apt-archives"

      - name: проверки
        env:
          HERON_REQUIRE_NGINX: "1"
          # Ветка для check_translation.py: на pull_request — целевая (base_ref),
          # на push — сама ветка или тег (ref_name). HEAD у pull_request
          # отсоединён, git branch --show-current там пуст.
          HERON_BRANCH: ${{ github.base_ref || github.ref_name }}
        # Тот же набор, что гоняется локально одной командой: граница ядра,
        # формат, линтер, тесты. Два места с разными наборами расходятся
        # в первый же день — и расходились.
        run: bash scripts/check.sh

  # Браузерные тесты (XSS, согласие на счётчики): Chromium ставится только здесь и только на время
  # задания (`uv run --with`), в зависимости движка он не попадает.
  # HERON_REQUIRE_BROWSER=1 — без браузера тест падает, а не пропускается.
  browser:
    name: браузер (Chromium)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: поставить uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: python 3.12
        run: uv python install 3.12

      - name: зависимости
        run: uv sync --group dev

      - name: версия Playwright для ключа кеша
        id: pw
        run: echo "version=1.63.0" >> "$GITHUB_OUTPUT"

      - name: кеш Chromium (Playwright)
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        # ubuntu-26.04 Playwright знает с 1.61; версия ниже падает на
        # `install --with-deps`: «does not support chromium on ubuntu26.04».
        run: uv run --with playwright==1.63.0 playwright install --with-deps chromium

      - name: системные зависимости Chromium (браузер из кеша)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: uv run --with playwright==1.63.0 playwright install-deps chromium

      - name: JSON-LD, заголовки и согласие на счётчики в браузере
        env:
          HERON_REQUIRE_BROWSER: "1"
        run: uv run --with playwright==1.63.0 pytest tests -k browser -rs

  # Сборка и дымовая проверка образа не зависят от quality и browser, поэтому
  # идут параллельно с ними. Здесь ничего не публикуется: права только на чтение.
  image-build:
    name: образ движка (сборка и проверка)
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: docker/setup-buildx-action@v4

      - name: теги
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=sha,format=short

      - name: время сборки — время коммита
        # Воспроизводимость: одно и то же дерево даёт одну и ту же метку
        # (heron --version) и одинаковые времена файлов в слоях.
        id: stamp
        run: |
          epoch="$(git log -1 --format=%ct)"
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u -d "@$epoch" '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: сборка кандидата
        # Образ собирается и проверяется здесь БЕЗ push; слои уходят в кеш gha
        # (scope heron-engine), из которого их берёт publish.
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: ${{ steps.stamp.outputs.epoch }}
        with:
          context: .
          load: true
          push: false
          tags: heron:candidate
          labels: ${{ steps.meta.outputs.labels }}
          # heron --version → 0.1.0 (beta, 55249f0, 2026-10-05 19:12 UTC)
          build-args: |
            HERON_CHANNEL=${{ github.ref_name }}
            HERON_REVISION=${{ github.sha }}
            HERON_BUILT=${{ steps.stamp.outputs.built }}
            SOURCE_DATE_EPOCH=${{ steps.stamp.outputs.epoch }}
          cache-from: type=gha,scope=heron-engine
          cache-to: type=gha,mode=max,scope=heron-engine

      - name: дымовая проверка кандидата
        # Временный сайт: new, затем строгая прод-сборка — с теми же
        # ограничениями контейнера, что у site.sh и workflow образа сайта.
        env:
          SOURCE_DATE_EPOCH: ${{ steps.stamp.outputs.epoch }}
        run: bash scripts/smoke-engine.sh heron:candidate "$GITHUB_SHA"

  # Публикация только после трёх зелёных job. Образ пересобирается из кеша gha
  # (scope heron-engine), заполненного image-build: те же вход и build-args,
  # поэтому все слои берутся из кеша, и уходит ровно проверенное дерево.
  # packages: write есть только у этого job.
  publish:
    name: публикация образа
    needs: [quality, browser, image-build]
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: docker/setup-buildx-action@v4

      - name: теги
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=sha,format=short

      - name: время сборки — время коммита
        id: stamp
        run: |
          epoch="$(git log -1 --format=%ct)"
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u -d "@$epoch" '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: сборка из кеша image-build
        # Только чтение кеша (cache-to нет): пересборка быстрая, слои те же.
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: ${{ steps.stamp.outputs.epoch }}
        with:
          context: .
          load: true
          push: false
          tags: heron:candidate
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            HERON_CHANNEL=${{ github.ref_name }}
            HERON_REVISION=${{ github.sha }}
            HERON_BUILT=${{ steps.stamp.outputs.built }}
            SOURCE_DATE_EPOCH=${{ steps.stamp.outputs.epoch }}
          cache-from: type=gha,scope=heron-engine

      - name: вход в ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: публикация проверенного образа
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag heron:candidate "$tag"
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"
          docker image inspect --format '{{json .RepoDigests}}' heron:candidate

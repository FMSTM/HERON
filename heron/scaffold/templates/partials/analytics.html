{# heron:note analytics #}
{% if site.analytics.gtm or site.analytics.ga4 or site.analytics.metrika %}
<div class="consent" data-consent hidden role="dialog" aria-live="polite" aria-label="{{ t.consent_title }}">
  <p>{{ t.consent_text }}</p>
  <div class="consent-actions">
    <button type="button" data-consent-accept>{{ t.consent_accept }}</button>
    <button type="button" class="quiet" data-consent-decline>{{ t.consent_decline }}</button>
  </div>
</div>
{% endif %}

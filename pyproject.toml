[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heron"
version = "0.1.0"
description = "Файловый движок сайтов: markdown и Jinja2 на входе, статический сайт на выходе"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
dependencies = [
    "click>=8.1",
    "Jinja2>=3.1",
    "markdown-it-py>=3.0",
    "PyYAML>=6.0",
    "pydantic>=2.7",
    "Pillow>=10.3",
]

[project.scripts]
heron = "heron.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["heron"]

# Документация едет в пакете: `heron docs` читает её ровно той версии, что
# и движок, без клона и без сети. Только текст — картинки бренда не нужны.
[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "heron/_docs/AGENTS.md"
"README.md" = "heron/_docs/README.md"
"docs/architecture.md" = "heron/_docs/docs/architecture.md"
"docs/agents" = "heron/_docs/docs/agents"
"docs/guide" = "heron/_docs/docs/guide"
"docs/spec" = "heron/_docs/docs/spec"

[tool.ruff]
line-length = 100
target-version = "py312"
# Документация — проза, а не код. Фрагменты в ней иллюстрируют мысль:
# выравнивание комментариев там осмысленно, и форматтеру в них делать нечего.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

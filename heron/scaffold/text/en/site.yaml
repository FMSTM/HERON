# The single source of truth about the site. Everything written here
# drives both the build and the folder layout: languages and theme come from here.
# Fill this file in, then run `heron init` - the folders will follow the config.
# All keys are described in `heron docs contract`, section 5
# (in the engine repository: docs/en/spec/20-data-contract.md).

# Engine version the site is built with. Required.
heron: "{spec}"

site:
  domain: {domain}
  name: {name_yaml}
  # alternate_names: []
  # ↑ other names of the site for search engines (WebSite.alternateName), e.g. [Site, Site.ua].
  #   For one language: alternate_names_<lang>, e.g. alternate_names_ru
  theme: {theme}
  default_lang: {default_lang}
  languages: [{languages}]
  # ↑ add languages here, then run `heron init` - content/<lang>/ with starter
  #   pages and theme/i18n/<lang>.yaml will appear.
  #   default_lang is served from the root and must be in the list.

seo:
  title_suffix: ""
  # ↑ appended to every page <title>: " - Site name"
  og_default_image: media/cover.png
  # ↑ default cover for pages without their own image (og:image)
  llms_txt: true
  robots_extra: []

nav:
  main: ["/"]
  # ↑ page keys of the main menu, in order: file path without .md,
  #   the home page is "/". For example: ["/", about, services]

# Public counter IDs. Not secrets: they are visible in the page source.
# Inserted into production builds only, after the visitor consents.
# Keys: ga4, gtm, metrika.
analytics:
  ga4:
  gtm:

build:
  notes: en
  # ↑ language of comments and hints written by heron init and heron page: ru or en. Override: --notes or HERON_NOTES
  agents: {agents}
  # ↑ instruction kit for AI agents in agents/: true - full, kit - without guides and specs, false - do not place it
  fail_on_warning: false
  allow_raw_html: false

plugins: []

# No passwords or tokens here: the build is static, and anything it can
# see may end up in HTML. Form passwords live in the separate forms
# service. Publishing keys live in docker login or in CI; with a clone of
# the engine, deploy tokens live in env/.env.<site>.<env>.

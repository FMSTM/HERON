name: {theme}
version: "0.3"
title: {theme_title}
heron: ">=0.3"

# What the theme expects from site.yaml. The engine checks these paths are filled in
requires: []

# The contract for people and programs that fill pages: page types and their
# sections, the fields of every block, category views and hints in ru and en. The
# template of a type is templates/<type>.html, a form may follow a colon in uses: "how:steps".
{contract}

# Ratios and widths the engine fits masters from media/ into
images:
  widths: [400, 800, 1200, 1600]
  ratios: ["1:1", "16:9"]
  formats: [avif, webp]
  fallback_width: 800
  # ↑ fallback PNG/JPEG for <img src> - one width. The build only cuts what
  #   templates asked for through picture() and media_url()

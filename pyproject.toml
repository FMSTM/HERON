[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heron"
version = "0.1.0"
description = "Файловый движок сайтов: markdown и Jinja2 на входе, статический сайт на выходе"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
dependencies = [
    "click>=8.1",
    "Jinja2>=3.1",
    "markdown-it-py>=3.0",
    "PyYAML>=6.0",
    "pydantic>=2.7",
    # ниже 13.0.0 открыты CVE-2026-96636…96644, -96778, -112393, -112396,
    # -112892 и GHSA-78g4-xqwv-q3g8 (декодеры форматов, которые режет движок)
    "Pillow>=13.0.0",
]

[project.scripts]
heron = "heron.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[tool.uv]
# Нижняя граница транзитивной зависимости (через pre-commit): ниже 21.7.13
# открыты CVE-2026-102930, -102938, -102937, -102925 (GHSA-94p9-xgh2-xp45,
# GHSA-9h9j-4vrj-gf7g, GHSA-x78j-v8h9-3j2q, GHSA-p58f-9548-mpm2); ниже
# 21.14.9 — CVE-2026-113722.
constraint-dependencies = ["virtualenv>=21.14.9"]

[tool.hatch.build.targets.wheel]
packages = ["heron"]

# Документация едет в пакете: `heron docs` читает её ровно той версии, что
# и движок, без клона и без сети. Только текст — картинки бренда не нужны.
[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "heron/_docs/AGENTS.md"
# рецепт образа сайта: `heron recipe` отдаёт его ровно этой версии
"Dockerfile.site" = "heron/_recipe/Dockerfile.site"
"README.md" = "heron/_docs/README.md"
"docs/architecture.md" = "heron/_docs/docs/architecture.md"
"docs/agents" = "heron/_docs/docs/agents"
"docs/guide" = "heron/_docs/docs/guide"
"docs/spec" = "heron/_docs/docs/spec"

[tool.ruff]
line-length = 100
target-version = "py312"
# Документация — проза, а не код. Фрагменты в ней иллюстрируют мысль:
# выравнивание комментариев там осмысленно, и форматтеру в них делать нечего.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

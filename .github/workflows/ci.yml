name: ci

on:
  push:
    branches: [dev, stage, prod]
    tags: ["v*"]
  pull_request:
    branches: [dev, stage, prod]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/heron

jobs:

  quality:
    name: линт и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: поставить uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: python 3.12
        run: uv python install 3.12

      - name: зависимости
        run: uv sync --group dev

      - name: граница ядра по всем файлам
        run: |
          mapfile -t files < <(git ls-files)
          bash scripts/check-boundaries.sh "${files[@]}"

      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: pytest
        run: uv run pytest

  image:
    name: образ движка
    needs: quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: вход в ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: теги
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short

      - name: сборка и публикация
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: дымовая проверка образа
        run: |
          tag=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker run --rm --network=none --read-only --tmpfs /tmp \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --user 65534:65534 "$tag" --version

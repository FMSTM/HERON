name: ci

on:
  push:
    branches: [dev, stage, prod]
    tags: ["v*"]
  pull_request:
    branches: [dev, stage, prod]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/heron

jobs:

  quality:
    name: линт и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: поставить uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: python 3.12
        run: uv python install 3.12

      - name: зависимости
        run: uv sync --group dev

      - name: граница ядра по всем файлам
        run: |
          mapfile -t files < <(git ls-files)
          bash scripts/check-boundaries.sh "${files[@]}"

      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: pytest
        run: uv run pytest

  image:
    name: образ движка
    needs: quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: вход в ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: теги
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short

      - name: сборка и публикация
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: образ реально собирает сайт
        run: |
          tag=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          mkdir -p smoke && chmod 777 smoke

          # ровно тот запуск, которым сайт собирается в проде:
          # без сети, read-only, без capability, не от рута
          run() {
            docker run --rm \
              --network=none \
              --read-only --tmpfs /tmp \
              --cap-drop=ALL --security-opt=no-new-privileges \
              --user "$(id -u):$(id -g)" \
              -v "$PWD/smoke:/out" -w /out \
              "$tag" "$@"
          }

          run --version
          run new demo
          docker run --rm \
            --network=none --read-only --tmpfs /tmp \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/smoke/demo:/site" \
            "$tag" build --strict

          for file in index.html sitemap.xml robots.txt llms.txt assets/site.css; do
            test -s "smoke/demo/dist/$file" || { echo "нет dist/$file"; exit 1; }
          done
          grep -q "<h1>" smoke/demo/dist/index.html || { echo "в index.html нет заголовка"; exit 1; }
          echo "образ собрал сайт: $(find smoke/demo/dist -type f | wc -l) файлов"

          # то же самое дважды подряд должно дать те же байты
          sha=$(sha256sum smoke/demo/dist/index.html | cut -d' ' -f1)
          docker run --rm \
            --network=none --read-only --tmpfs /tmp \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/smoke/demo:/site" \
            "$tag" build --strict
          test "$sha" = "$(sha256sum smoke/demo/dist/index.html | cut -d' ' -f1)" \
            || { echo "две сборки подряд дали разный результат"; exit 1; }
          echo "сборка воспроизводима"


name: {theme}
version: "0.2"
title: {theme_title}

# What the theme expects from site.yaml. The engine checks these paths are filled in
requires: []

modules: [prose, list, checklist, steps, table, facts, faq, timeline, callout, gallery, tabs, breadcrumbs, children]

# Page type → sections it uses. Template: templates/<type>.html.
# The expected form may follow a colon: "how:steps"
types:
  home:
    uses: [intro, "*"]
  page:
    uses: [intro, "*"]
  "404":
    uses: [intro]

# Ratios and widths the engine fits masters from media/ into
images:
  widths: [400, 800, 1200, 1600]
  ratios: ["1:1", "16:9"]
  formats: [avif, webp]
  fallback_width: 800
  # ↑ fallback PNG/JPEG for <img src> — one width. The build only cuts what
  #   templates asked for through picture() and media_url()

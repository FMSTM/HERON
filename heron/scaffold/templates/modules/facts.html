<section id="{{ section.id }}" class="block facts">
  {% if section.title %}<h2>{{ section.title }}</h2>{% endif %}
  {% if section.lead %}<p class="lead-in">{{ section.lead|safe }}</p>{% endif %}
  <dl>{% for row in items %}<div><dt>{{ row.key|safe }}</dt><dd>{{ row.value|safe }}</dd></div>{% endfor %}</dl>
</section>

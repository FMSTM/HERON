name: {theme}
version: "0.3"
title: {theme_title}
heron: ">=0.3"

# Что тема ждёт от site.yaml. Движок проверит, что эти пути заполнены
requires: []

# Контракт для людей и программ, которые заполняют страницы: типы страниц и их
# секции, поля каждого блока, виды категорий и подсказки на ru и en. Шаблон типа -
# templates/<тип>.html, после двоеточия в uses можно назвать форму: "how:steps".
{contract}

# Пропорции и ширины, в которые движок впишет мастера из media/
images:
  widths: [400, 800, 1200, 1600]
  ratios: ["1:1", "16:9"]
  formats: [avif, webp]
  fallback_width: 800
  # ↑ запасной PNG/JPEG для <img src> - одна ширина. В сборку режется только
  #   то, что шаблоны попросили через picture() и media_url()

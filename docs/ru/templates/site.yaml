# Образец site.yaml со всеми ключами ядра. Описание - ../spec/20-data-contract.md (в репозитории движка docs/<язык>/spec/), раздел 5.
# Значения ниже - примеры. Чего у сайта нет, то удаляется или остаётся пустым:
# выдуманный телефон хуже отсутствующего.

heron: ">=0.2,<0.3"            # версия движка, которую требует сайт. Обязательна, первой строкой

site:
  domain: example.com          # без схемы и слешей
  # domains:                   # домен на окружение: превью-сборка ссылается на себя
  #   dev: dev.example.com
  theme: main                  # имя темы; локальная папка theme/ сильнее пакета
  default_lang: en             # отдаётся из корня: content/en/about.md → /about/
  languages: [en, ru]          # от одного до N; остальные - под /<lang>/: /ru/o-nas/
  name: Daybreak               # название сайта
  name_ru: Рассвет             # то же на языке ru; без него - name
  alternate_names: []          # другие написания названия -> WebSite.alternateName; по языкам alternate_names_ru

seo:
  title_suffix: " - Daybreak"  # дописывается к <title> темой
  title_suffix_ru: " - Рассвет"
  og_default_image: media/og/default.png        # картинка для соцсетей по умолчанию
  og_default_image_ru: media/og/default-ru.png  # своя для ru, если нужна
  twitter_card: summary_large_image
  llms_txt: true               # полные тексты для нейросетей: llms-full*.txt
  llms_note:                   # сведения о сайте для llms*.txt, дословно, по языкам
    en: |
      ### How to reach us

      Phone and opening hours are on the contacts page.
    ru: |
      ### Как связаться

      Телефон и часы работы - на странице контактов.
  robots_extra: []             # дополнительные строки robots.txt
  allow_prices: false          # true - цены в разметке schema.org разрешены
  # feed: article              # тип страниц для ленты Atom; нет ключа - нет ленты
  feed_limit: 20

nav:
  main: ["/", about, services, contacts]   # ключи страниц: путь файла без .md, главная - "/"
                                           # на русских страницах about сам станет /ru/o-nas/
  # footer: [privacy]                      # имена групп придумывает тема

analytics:                     # только в прод-сборке; стартовая тема выводит ga4, gtm и metrika после согласия посетителя
  ga4:
  gtm:
  # metrika:                   # идентификатор счётчика

build:
  notes: ru                    # язык пояснений и комплекта agents/: ru или en. Без ключа - en,
                               # и `heron init --agents` переложит комплект на английский
  agents: true                 # комплект для агентов: true - полный, kit - без guide/ и spec/, false - нет
  fail_on_warning: false       # true - как --strict
  allow_raw_html: false        # сырой HTML в markdown
  updated_from: git            # manual | git | file - откуда дата обновления
  workers: 0                   # процессов на нарезку картинок; 0 - по числу ядер
  generator: true              # подпись движка в страницах; false - без неё
  overrides: []                # сгенерированные файлы, которые заменяет static/: [robots.txt]

plugins: []

# forms:                       # формы сайта; принимает отдельный сервис heron-relay, пока не реализован
#   callback:
#     fields: [name, phone]
#     sinks: [mail]
# sinks:
#   mail: {to: info@example.com}

# nginx:
#   hash_sizes: auto           # устарел, ничего не делает

gone:                          # 410: точные адреса, префиксы, адрес с параметром
  - /sample-page/
  - /wp-*
  - /?p=*

# Блоки ниже ядро не разбирает: их берут тема и подстановки schema.
# Языковой вариант значения - тем же суффиксом: address_ru.
contact:
  phone: ""
  address: ""
  address_ru: ""
  city: ""
  geo: []                      # [широта, долгота]

organization:
  name: ""
  same_as: []

# Обычно записывает конфигуратор heron setup; руками - только там, где конфигуратора нет.
schema:
  entity:                      # сквозной узел сайта, на каждой индексируемой странице
    "@id": "#org"
    "@type": Organization
    name: "{{ organization.name }}"
    telephone: "{{ contact.phone }}"
    url: "{{ site.base }}"


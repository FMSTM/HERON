[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heron"
version = "0.1.0"
description = "Файловый движок сайтов: markdown и Jinja2 на входе, статический сайт на выходе"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
dependencies = [
    "click>=8.1",
    "Jinja2>=3.1",
    "markdown-it-py>=3.0",
    "PyYAML>=6.0",
    "pydantic>=2.7",
    "Pillow>=10.3",
]

[project.scripts]
heron = "heron.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["heron"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

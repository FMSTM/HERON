<section id="{{ section.id }}" class="block table">
  {% if section.title %}<h2>{{ section.title }}</h2>{% endif %}
  <div class="scroll">
  <table>
    <thead><tr>{% for cell in items.head %}<th scope="col">{{ cell|safe }}</th>{% endfor %}</tr></thead>
    <tbody>
    {% for row in items.rows %}<tr>{% for cell in row %}<td>{{ cell|safe }}</td>{% endfor %}</tr>{% endfor %}
    </tbody>
  </table>
  </div>
</section>

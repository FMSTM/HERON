# Комментарии стартовой темы на языке пояснений сайта (build.notes).
# Шаблоны в heron/scaffold/templates/ несут на их месте метку
# `{# heron:note <ключ> #}` или `/* heron:note <ключ> */`; при копировании
# темы в сайт метка заменяется текстом отсюда как есть. Ключи ru и en
# совпадают, это проверяет tests/test_scaffold_notes.py.
base.scheme: |-
  {# светлая или тёмная: выбор человека, иначе - как в системе #}
checklist: |-
  {# checklist: три и больше групп ### со списками; two-lists: ровно две, рядом #}
timeline: |-
  {# timeline: пары «период | событие» или нумерованные шаги #}
children: |-
  {# Страницы раздела: страница _index.md показывает свои дочерние карточками,
     а с `view: list` во фронтматтере - списком строк (виды - `views` в theme.yaml). #}
tabs: |-
  {# Вкладки без скриптов: на каждую вкладку переключатель, CSS показывает выбранную.
     Без CSS каждая вкладка - обычный заголовок с содержимым, читается как есть. #}
sections: |-
  {# Все секции страницы, каждая модулем своей формы.
     Своя тема обычно ставит секции по якорю:
     {{ mod.faq('faq') }} ровно там, где место вопросам. #}
footer: |-
  {# Контакты - из site.yaml: contact.channels пишет конфигуратор (heron setup).
     У старого конфига каналов нет - тогда основной телефон и почта. #}
mark: |-
  {# Знак HERON. Цвета - из переменных темы: --mark-a и --mark-b, в тёмной теме свои. #}
analytics: |-
  {# Счётчики - только после согласия посетителя.

     До выбора на странице нет ни одного скрипта счётчика и ни одного запроса к
     ним: только плашка. «Принять» - счётчики подключаются сразу и на
     следующих страницах; «Отказаться» - не подключаются, плашка больше не
     показывается. Выбор хранится в localStorage этого браузера
     (heron-consent: yes | no), передумать - кнопка в подвале.
     Номера счётчиков - из site.yaml (analytics.*), на тег
     подключения скрипта они попадают атрибутами data-*, а читает их
     файл темы: это данные, а не разметка. #}
css.tokens: |-
  /* Стартовая тема HERON - белая, простая, читаемая. Поменяйте переменные ниже, и она ваша. */
css.dark: |-
  /* Тёмная тема: по настройке системы или по кнопке в шапке (data-theme). */
css.tabs: |-
  /* до двенадцати вкладок; для большего числа добавьте строки выше */
css.consent: |-
  /* согласие на счётчики: плашка внизу экрана, до выбора счётчиков нет */

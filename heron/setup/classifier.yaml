# Классификатор сфер деятельности для анкеты `heron setup`.
#
# Это общий справочник, а не данные какого-то сайта: сферы и специализации,
# по которым описывают себя люди и организации, с типами schema.org там, где
# у schema.org есть точный тип. Организация с типом специализации получает его
# в разметке (стоматология → Dentist); человек — подпись профессии
# (`person`) и сферу как knowsAbout.
#
# Подписи — на русском и английском; другие языки берут английскую.
# Добавить сферу или специализацию — дописать строку, код анкеты не меняется.
# Номера `id` не переиспользуются: по ним анкета узнаёт записанный ответ.


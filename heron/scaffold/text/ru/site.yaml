# Единственная точка правды о сайте. Всё, что здесь написано,
# определяет и сборку, и структуру папок: языки отсюда, тема отсюда.
# Заполните файл, затем выполните `heron init` - папки догонят конфиг.
# Описание всех ключей: `heron docs contract`, раздел 5
# (в репозитории движка - docs/ru/spec/20-data-contract.md).

# Версия движка, на которой собирается сайт. Обязательна.
heron: "{spec}"

site:
  domain: {domain}
  name: {name_yaml}
  # alternate_names: []
  # ↑ другие названия сайта для поисковиков (WebSite.alternateName), например [Site, Сайт.ua].
  #   Для отдельного языка: alternate_names_<язык>, например alternate_names_ru
  theme: {theme}
  default_lang: {default_lang}
  languages: [{languages}]
  # ↑ добавьте языки сюда, потом `heron init` - появятся content/<язык>/
  #   со стартовыми страницами и theme/i18n/<язык>.yaml.
  #   default_lang отдаётся из корня и должен быть в списке.

seo:
  title_suffix: ""
  # ↑ дописывается к <title> каждой страницы: " - Название"
  og_default_image: media/cover.png
  # ↑ обложка по умолчанию для страниц без своей картинки (og:image)
  llms_txt: true
  robots_extra: []

nav:
  main: ["/"]
  # ↑ ключи страниц верхнего меню по порядку: путь файла без .md,
  #   главная - "/". Например: ["/", about, services]

# Публичные идентификаторы счётчиков. Не секреты: видны в исходнике
# страницы. Вставляются только в прод-сборке. Ключи: ga4, gtm
# (и metrika - заготовка темы его не выводит, нужна своя тема).
analytics:
  ga4:
  gtm:

build:
  notes: ru
  # ↑ язык комментариев и пояснений, которые кладут heron init и heron page: ru или en. Перебивается --notes или HERON_NOTES
  agents: {agents}
  # ↑ комплект инструкций для AI-агентов в agents/: true - полный, kit - без гайдов и спецификаций, false - не класть
  fail_on_warning: false
  allow_raw_html: false

plugins: []

# Пароли и токены сюда НЕ пишут. SMTP форм, ключи деплоя и прочее
# живут в окружении сборки, в HERON/env/.env.<сайт>.<окружение>:
# сборка статическая, и всё, что она видит, может оказаться в HTML.
